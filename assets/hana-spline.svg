<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Hana-inspired spline illustration for hana-viewer</title>
  <desc id="desc">A stylized gradient ribbon and orb scene inspired by spline-style visuals, adapted for the hana-viewer package README.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#111a3a"/>
      <stop offset="100%" stop-color="#1c1040"/>
    </linearGradient>

    <radialGradient id="orbGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffd9ff"/>
      <stop offset="35%" stop-color="#ff8ad8"/>
      <stop offset="75%" stop-color="#8f7dff"/>
      <stop offset="100%" stop-color="#4f53d9"/>
    </radialGradient>

    <linearGradient id="ribbonGradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6cf2ff"/>
      <stop offset="45%" stop-color="#8a8dff"/>
      <stop offset="100%" stop-color="#ff7bcf"/>
    </linearGradient>

    <linearGradient id="ribbonGradB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9af7ff"/>
      <stop offset="40%" stop-color="#b497ff"/>
      <stop offset="100%" stop-color="#ff9de1"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="deepShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <clipPath id="cardClip">
      <rect x="80" y="70" width="1040" height="560" rx="34"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>

  <!-- Subtle stars / particles -->
  <g opacity="0.35">
    <circle cx="140" cy="120" r="2" fill="#b8c3ff"/>
    <circle cx="210" cy="210" r="1.7" fill="#d2dbff"/>
    <circle cx="1050" cy="130" r="2.2" fill="#c6d0ff"/>
    <circle cx="980" cy="260" r="1.5" fill="#e3e8ff"/>
    <circle cx="860" cy="90" r="1.4" fill="#cfd9ff"/>
    <circle cx="330" cy="95" r="1.3" fill="#e1e6ff"/>
    <circle cx="1120" cy="340" r="1.8" fill="#bec9ff"/>
  </g>

  <!-- Framed composition -->
  <g clip-path="url(#cardClip)">
    <rect x="80" y="70" width="1040" height="560" rx="34" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2"/>

    <!-- Large orb -->
    <g filter="url(#deepShadow)">
      <circle cx="745" cy="335" r="185" fill="url(#orbGrad)"/>
      <ellipse cx="700" cy="270" rx="68" ry="42" fill="rgba(255,255,255,0.34)" transform="rotate(-16 700 270)"/>
    </g>

    <!-- Main spline-like ribbons -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M115 425 C 240 260, 420 240, 560 330 C 670 400, 790 430, 1010 350"
            stroke="url(#ribbonGradA)" stroke-width="76" opacity="0.92" filter="url(#softGlow)"/>
      <path d="M95 460 C 240 310, 410 285, 545 365 C 670 440, 820 470, 1050 390"
            stroke="url(#ribbonGradB)" stroke-width="48" opacity="0.82"/>
      <path d="M170 300 C 320 190, 470 190, 610 270 C 760 355, 900 360, 1085 290"
            stroke="url(#ribbonGradA)" stroke-width="22" opacity="0.7"/>
    </g>

    <!-- Accent loops -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M310 505 C 355 560, 445 565, 500 520 C 548 482, 545 430, 485 405 C 430 383, 365 400, 335 450"
            stroke="#9fdcff" stroke-width="10"/>
      <path d="M840 470 C 890 525, 980 520, 1020 470"
            stroke="#ffb2e7" stroke-width="9"/>
    </g>
  </g>

  <!-- Package badge -->
  <g transform="translate(112,98)" filter="url(#deepShadow)">
    <rect x="0" y="0" rx="16" width="330" height="92" fill="rgba(9,13,28,0.78)" stroke="rgba(170,188,255,0.4)" stroke-width="1"/>
    <text x="22" y="40" fill="#dfe6ff" font-size="28" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-weight="700">hana-viewer</text>
    <text x="22" y="66" fill="#9fb1ff" font-size="14" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif">React wrapper for Hana Spline scenes</text>
  </g>

  <!-- Optional center label -->
  <g transform="translate(846,595)">
    <text x="0" y="0" text-anchor="end" fill="rgba(231,237,255,0.7)" font-size="13" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif">
      hana-inspired artwork
    </text>
  </g>
</svg>
